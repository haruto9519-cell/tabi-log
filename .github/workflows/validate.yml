name: Validate Tabi Log
on:
  pull_request:
  push:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check share.js
          node --check worker/src/index.js
      - name: Check required share files
        run: |
          test -f config.js
          test -f share.html
          test -f worker/migrations/0002_share_links.sql
      - name: Validate Wrangler configuration without deploying
        working-directory: worker
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/tabi-log-worker-dry-run --config wrangler.toml
      - name: Apply D1 migrations to an isolated local database
        working-directory: worker
        run: npx --yes wrangler@4 d1 migrations apply tabi-log-db --local --config wrangler.toml
      - name: Verify local photo storage schema
        working-directory: worker
        run: |
          npx --yes wrangler@4 d1 execute tabi-log-db --local --command "PRAGMA table_info(posts)" --config wrangler.toml | tee /tmp/tabi-log-post-columns.txt
          grep -q "media_data" /tmp/tabi-log-post-columns.txt
