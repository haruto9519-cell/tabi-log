name: Validate Tabi Log
on:
  pull_request:
  push:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check expense-sync.js
          node --check app.js
          node --check share.js
          node --check worker/src/index.js
      - name: Test expense synchronization merge behavior
        run: node --test tests/expense-sync.test.cjs
      - name: Check required share files
        run: |
          test -f config.js
          test -f share.html
          test -f worker/migrations/0002_share_links.sql
          test -f worker/migrations/0012_user_profile_bio.sql
      - name: Validate Wrangler configuration without deploying
        working-directory: worker
        run: npx --yes wrangler@4 deploy --dry-run --outdir /tmp/tabi-log-worker-dry-run --config wrangler.toml
      - name: Apply D1 migrations to an isolated local database
        working-directory: worker
        run: npx --yes wrangler@4 d1 migrations apply tabi-log-db --local --config wrangler.toml
      - name: Smoke-test account deletion SQL on isolated local D1
        working-directory: worker
        run: |
          npx --yes wrangler@4 d1 execute tabi-log-db --local --file=tests/account_deletion_smoke.sql --config wrangler.toml | tee /tmp/tabi-log-account-delete-smoke.txt
          grep -q "PASS" /tmp/tabi-log-account-delete-smoke.txt
          npx --yes wrangler@4 d1 execute tabi-log-db --local --command "PRAGMA table_info(share_links)" --config wrangler.toml | tee /tmp/tabi-log-share-columns.txt
          grep -q "owner_id" /tmp/tabi-log-share-columns.txt
      - name: Verify local photo storage schema
        working-directory: worker
        run: |
          npx --yes wrangler@4 d1 execute tabi-log-db --local --command "PRAGMA table_info(posts)" --config wrangler.toml | tee /tmp/tabi-log-post-columns.txt
          grep -q "media_data" /tmp/tabi-log-post-columns.txt
          npx --yes wrangler@4 d1 execute tabi-log-db --local --command "PRAGMA table_info(users)" --config wrangler.toml | tee /tmp/tabi-log-user-columns.txt
          grep -q "bio" /tmp/tabi-log-user-columns.txt
          npx --yes wrangler@4 d1 execute tabi-log-db --local --command "PRAGMA table_info(trips)" --config wrangler.toml | tee /tmp/tabi-log-trip-columns.txt
          grep -q "origin_country" /tmp/tabi-log-trip-columns.txt
          grep -q "arrival_airport" /tmp/tabi-log-trip-columns.txt
          grep -q "first_attraction" /tmp/tabi-log-trip-columns.txt
