name: Deploy Tabi Log Pages
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "config.js"
      - "share.html"
      - "share.js"
      - "styles.css"
      - "privacy.html"
      - "terms.html"
      - "_headers"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::GitHub Actions secret CLOUDFLARE_API_TOKEN is not set"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::GitHub Actions secret CLOUDFLARE_ACCOUNT_ID is not set"; exit 1; }
      - name: Prepare Pages output
        run: |
          mkdir -p public
          cp index.html app.js config.js share.html share.js styles.css privacy.html terms.html _headers public/
          test -s public/index.html
          test -s public/app.js
          test -s public/styles.css
      - name: Deploy production site to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy public --project-name=tabi-log --branch=main
