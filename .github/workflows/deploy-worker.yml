name: Inspect Tabi Log D1 schema
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect existing trips and stop columns
        run: npx --yes wrangler@4 d1 execute tabi-log-db --remote --config wrangler.toml --command "PRAGMA table_info(trips); PRAGMA table_info(trip_stops);"
