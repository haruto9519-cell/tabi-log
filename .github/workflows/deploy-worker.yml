name: Deploy Tabi Log Worker
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker syntax
        run: node --check src/index.js
      - name: Check Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::GitHub Actions secret CLOUDFLARE_API_TOKEN is not set"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::GitHub Actions secret CLOUDFLARE_ACCOUNT_ID is not set"; exit 1; }
      - name: Apply pending D1 migrations
        run: npx --yes wrangler@4 d1 migrations apply tabi-log-db --remote --config wrangler.toml
      - name: Deploy and explicitly promote Worker version
        shell: bash
        run: |
          set -o pipefail
          deploy_output="$(npx --yes wrangler@4 deploy --config wrangler.toml 2>&1)"
          printf '%s\n' "$deploy_output"
          version_id="$(printf '%s\n' "$deploy_output" | sed -n 's/^Current Version ID: //p' | tail -n 1)"
          if [ -z "$version_id" ]; then
            echo "::error::Could not determine the uploaded Worker version ID"
            exit 1
          fi
          echo "Promoting exact uploaded version: $version_id"
          npx --yes wrangler@4 versions deploy "$version_id@100%" --yes --config wrangler.toml
      - name: Inspect active Worker deployment
        run: |
          npx --yes wrangler@4 deployments status --json --config wrangler.toml
          npx --yes wrangler@4 deployments list --json --config wrangler.toml
      - name: Verify deployed Worker and D1 schema
        run: |
          for attempt in $(seq 1 12); do
            response="$(curl -fsS -H 'Cache-Control: no-cache' "https://tabi-log.haruto-9519.workers.dev/api/health?release=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${attempt}" || true)"
            echo "$response"
            if echo "$response" | grep -q '"version":"2.6-account-deletion"' &&
               echo "$response" | grep -q '"configured":true' &&
               echo "$response" | grep -q '"coreSchemaReady":true' &&
               echo "$response" | grep -q '"shareSchemaReady":true' &&
               echo "$response" | grep -q '"shareOwnerSchemaReady":true' &&
               echo "$response" | grep -q '"authSchemaReady":true' &&
               echo "$response" | grep -q '"itinerarySchemaReady":true' &&
               echo "$response" | grep -q '"archiveSchemaReady":true' &&
               echo "$response" | grep -q '"expensesSchemaReady":true' &&
               echo "$response" | grep -q '"planImportsSchemaReady":true' &&
               echo "$response" | grep -q '"stopCoordinatesSchemaReady":true' &&
               echo "$response" | grep -q '"mediaSchemaReady":true' &&
               echo "$response" | grep -q '"mediaStorageReady":true' &&
               echo "$response" | grep -q '"mediaStorageProvider":"cloudflare-d1"' &&
               echo "$response" | grep -q '"pilgrimageSchemaReady":true'; then
              echo "Worker and D1 schema verified"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Worker or D1 schema verification failed"
          exit 1
      - name: Verify production private-media authorization and CORS
        shell: bash
        run: |
          set -euo pipefail
          base="https://tabi-log.haruto-9519.workers.dev"
          status="$(curl -sS -o /tmp/media-auth.json -w "%{http_code}" "$base/api/media/ci-auth-check" -H "Origin: https://tabi-log.pages.dev")"
          echo "Unauthenticated media status: $status"
          test "$status" = "401"
          allowed="$(curl -sS -D - -o /dev/null -X OPTIONS "$base/api/media/ci-auth-check" -H "Origin: https://tabi-log.pages.dev" -H "Access-Control-Request-Method: GET" | awk 'BEGIN{IGNORECASE=1} /^access-control-allow-origin:/ {gsub(/\r/, "", $2); print $2}' | tail -1)"
          echo "Allowed production origin: $allowed"
          test "$allowed" = "https://tabi-log.pages.dev"
          denied_headers="$(curl -sS -D - -o /dev/null -X OPTIONS "$base/api/media/ci-auth-check" -H "Origin: https://untrusted.tabi-log.pages.dev" -H "Access-Control-Request-Method: GET" 2>/dev/null || true)"
          denied="$(printf '%s\n' "$denied_headers" | grep -i '^access-control-allow-origin:' || true)"
          echo "Untrusted origin header: $denied"
          test -z "$denied"
          echo "Production private-media access and CORS checks passed."
