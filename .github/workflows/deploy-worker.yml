name: Deploy Tabi Log Worker
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Worker syntax
        run: node --check src/index.js
      - name: Check Cloudflare credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::GitHub Actions secret CLOUDFLARE_API_TOKEN is not set"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::GitHub Actions secret CLOUDFLARE_ACCOUNT_ID is not set"; exit 1; }
      - name: Deploy Worker
        run: npx --yes wrangler@4 deploy --config wrangler.toml
      - name: Verify deployed Worker
        run: |
          for attempt in $(seq 1 12); do
            response="$(curl -fsS https://tabi-log.haruto-9519.workers.dev/api/health || true)"
            echo "$response"
            if echo "$response" | grep -q '"version":"1.9-coordinate-preservation"'; then
              echo "Worker deployment verified"
              exit 0
            fi
            sleep 5
          done
          echo "::error::The deployed Worker did not report the expected version"
          exit 1
