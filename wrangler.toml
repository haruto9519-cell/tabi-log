# Cloudflare Workers Builds runs from the repository root (/).
# Keep this root config aligned with worker/wrangler.toml so
# "npx wrangler preview" resolves the Preview-specific D1 binding.

name = "tabi-log"
main = "worker/src/index.js"
compatibility_date = "2026-11-08"

[[d1_databases]]
binding = "DB"
database_name = "tabi-log-db"
database_id = "a0a64951-c309-49c6-bd2b-8990299080e2"
migrations_dir = "worker/migrations"

[vars]
GOOGLE_CLIENT_ID = "88585688478-1i3t68qc8ek9ffo3f0u4qj4rfvsm1n5h.apps.googleusercontent.com"

[previews]

[[previews.d1_databases]]
binding = "DB"
database_name = "tabi-log-preview-db"
database_id = "39d3d802-4d06-43d3-976e-21629d9b063f"
